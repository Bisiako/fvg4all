<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivio fotografico — lettura automatica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1 class="topbar__title">Archivio<span class="topbar__title-accent">.</span></h1>
  <p class="topbar__subtitle">Ogni cartella un mese, ogni immagine la sua trascrizione</p>
</header>

<div class="layout">

  <!-- Colonna mesi, stile schedario -->
  <nav class="months" id="months" aria-label="Seleziona mese">
    <p class="months__hint">Caricamento mesi…</p>
  </nav>

  <main class="stage">

    <div class="stage__bar">
      <div class="stage__info">
        <span class="stage__month" id="current-month">—</span>
        <span class="stage__count" id="current-count"></span>
      </div>
      <div class="view-toggle" role="group" aria-label="Modalità di visualizzazione">
        <button type="button" class="view-toggle__btn is-active" data-view="grid">Riquadri</button>
        <button type="button" class="view-toggle__btn" data-view="carousel">Carosello</button>
      </div>
    </div>

    <!-- Vista a riquadri (contact sheet) -->
    <section class="grid" id="grid-view" aria-live="polite"></section>

    <!-- Vista a carosello -->
    <section class="carousel" id="carousel-view" hidden>
      <button type="button" class="carousel__nav carousel__nav--prev" id="carousel-prev" aria-label="Immagine precedente">‹</button>
      <div class="carousel__frame" id="carousel-frame"></div>
      <button type="button" class="carousel__nav carousel__nav--next" id="carousel-next" aria-label="Immagine successiva">›</button>
      <div class="carousel__index" id="carousel-index"></div>
    </section>

    <p class="stage__empty" id="empty-state" hidden>Nessuna immagine trovata in questo mese.</p>

  </main>
</div>

<footer class="footer">
  <p>Il testo sotto ogni immagine è generato in automatico via OCR nel browser e potrebbe contenere imprecisioni.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
