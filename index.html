<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="fvg4all - Locandine, eventi e sagre del Friuli Venezia Giulia">
  <title>fvg4all — Eventi e Sagre del Friuli Venezia Giulia</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Tesseract.js: OCR direttamente nel browser -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">fvg</span><span class="brand-number">4</span><span class="brand-name">all</span>
    </div>
    <div>
      <h1>Eventi e Sagre del Friuli Venezia Giulia</h1>
      <p>Canale Telegram ufficiale @fvg4all</p>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div>
        <strong id="imageCount">0</strong> locandine trovate
      </div>

      <div class="toolbar-actions">
        <button id="gridButton" class="active" type="button">▦ Riquadri</button>
        <button id="carouselButton" type="button">◀ Carosello ▶</button>
      </div>
    </section>

    <section id="status" class="status">
      Ricerca delle locandine su GitHub…
    </section>

    <section id="gallery" class="gallery" aria-live="polite"></section>

    <section id="carousel" class="carousel hidden" aria-label="Carosello locandine">
      <button id="prevButton" class="carousel-arrow" type="button" aria-label="Immagine precedente">‹</button>
      <div id="carouselContent" class="carousel-content"></div>
      <button id="nextButton" class="carousel-arrow" type="button" aria-label="Immagine successiva">›</button>
    </section>
  </main>

  <footer>
    <p>fvg4all · Locandine ed eventi del Friuli Venezia Giulia</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
